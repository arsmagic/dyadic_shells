name = "DyadicShells"
version = "0.1.0"
defaultTargets = ["DyadicShells", "MainResults", "Challenge", "Solution", "PaperIndex", "ClosedForms", "HyperbolicSieve", "SparseBias", "SparseBiasAsymp", "SparseFamily", "SquareCount", "DensityLimits", "MultiplierPrime"]

[[lean_lib]]
name = "DyadicShells"

# Statement surface (root modules). MainResults is Mathlib-only; Challenge states
# the four claims with `sorry`; Solution proves them; PaperIndex is the alias map.
[[lean_lib]]
name = "MainResults"

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"

[[lean_lib]]
name = "PaperIndex"

# Target 4, milestone B: closed forms (proved; see ClosedForms.lean).
[[lean_lib]]
name = "ClosedForms"

# Target 4, milestone C: the hyperbolic sieve modulo powers of two (Theorem 3).
[[lean_lib]]
name = "HyperbolicSieve"

# Sparse-bias note, Proposition 1: exact low-bit gates of the two-adic square
# condition for N ≡ 3, 7 (mod 8); plus the N≡1 no-finite-gate theorem.
[[lean_lib]]
name = "SparseBias"

# Sparse-bias note, Corollary 4 (arithmetic core): binomial ceiling and decay.
[[lean_lib]]
name = "SparseBiasAsymp"

# Proposition 16 and Corollary 17 of the paper: sparse-offset families, end to end.
[[lean_lib]]
name = "SparseFamily"

# Lemma 6 of the paper: the number of squares modulo 2^n (Stangl's count).
[[lean_lib]]
name = "SquareCount"

# Corollary 2 of the paper: the uniform bound pi_m(N) > 1/24, the three limits,
# and sharpness of the constant 1/24.
[[lean_lib]]
name = "DensityLimits"

# Proposition 12 of the paper: an odd prime dividing the multiplier exactly once.
[[lean_lib]]
name = "MultiplierPrime"

[[require]]
name = "mathlib"
scope = "leanprover-community"
# Bumped from v4.24.0 to the Mathlib commit the eth/ formalization pins, which
# tracks Lean v4.33.1 and has a known-good nanoda / lean4export second-kernel setup.
rev = "0df444a360eaa60ab8c11dca51a86af692955474"
